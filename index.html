<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - To-Do List</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <h1>TaskFlow</h1>
        <p class="subtitle">Stay organized, one task at a time.</p>

        <form id="taskForm" class="task-form">
            <input type="text" id="taskInput" placeholder="What do you need to do?" autocomplete="off">
            <button type="submit" class="btn-add">Add</button>
        </form>

        <div class="toolbar">
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="pending">Pending</button>
                <button class="filter-btn" data-filter="done">Done</button>
            </div>
            <span id="counter" class="counter"></span>
        </div>

        <ul id="taskList" class="task-list"></ul>
        <p id="emptyMessage" class="empty">No tasks here yet.</p>

        <button id="clearDone" class="btn-clear">Clear completed</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
